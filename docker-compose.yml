# Dev environment (section 9): front, back and postgres in containers.
#   cp .env.example .env
#   docker compose up --build
# Front: http://localhost:8080 · API: http://localhost:3000 · DB: localhost:5432
# Demo data: docker compose exec backend npx prisma db seed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estuda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estuda}
      POSTGRES_DB: ${POSTGRES_DB:-estuda_mais}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-estuda}:${POSTGRES_PASSWORD:-estuda}@db:5432/${POSTGRES_DB:-estuda_mais}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
      PORT: 3000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080},http://localhost:5173
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
